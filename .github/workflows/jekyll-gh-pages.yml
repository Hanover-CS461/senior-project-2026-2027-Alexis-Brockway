name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Marp CLI
        run: npm install --global @marp-team/marp-cli@4.5.1

      - name: Build Marp slides
        run: |
          sudo chmod -R a+rwX ./_site
          mkdir -p ./_site/slides
          marp --html -I ./docs/slides -o ./_site/slides --theme-set ./docs/slides/themes

      - name: Copy slide assets
        run: |
          if [ -d "./docs/slides/assets" ]; then
            mkdir -p ./_site/slides/assets
            cp -r ./docs/slides/assets/. ./_site/slides/assets/
          fi

      # The app is built with `base` pointing at /<repo>/app/ (see
      # app/vite.config.ts), so it must be served from that exact subpath.
      # Credentials come from app/.env.production, which is committed on
      # purpose: the publishable key is public by design and RLS is what
      # actually protects the data.
      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      - name: Build the app
        working-directory: ./app
        run: npm run build

      - name: Copy the app into the site
        run: |
          mkdir -p ./_site/app
          cp -r ./app/dist/. ./_site/app/
          ls -la ./_site/app | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4